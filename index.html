<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; }

  /* Based on desired-ui.webp: charcoal screens, loud flat cards, white pill controls.
     System fonts only, so it loads instantly and works with no signal at the gym. */
  :root {
    --bg: #201f22;
    --card: #2f2e31;
    --line: #47464b;
    --text: #f6f5f2;
    --muted: #a9a8ad;
    --ink: #1c1b1e;
    --pill: #f6f5f2;
    --pill-hint: #66656b;
    --coral: #f5644f;
    --periwinkle: #7b7bf7;
    --butter: #f8cb62;
    --sky: #b5ecfa;
    --sage: #bfd0c4;
    --title-font: "DIN Condensed", "Bahnschrift Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
    --gap: 10px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
  }

  button {
    background: var(--card);
    border: 0;
    border-radius: 28px;
    color: inherit;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation; /* removes the double-tap-zoom delay on phones */
    transition: transform 80ms, filter 80ms;
  }
  button:active { filter: brightness(0.88); transform: scale(0.98); }

  input {
    width: 100%;
    min-width: 0;
    height: 64px;
    background: var(--pill);
    border: 0;
    border-radius: 32px;
    color: var(--ink);
    font: inherit;
    font-size: 1.15rem; /* 16px or more also stops iPhones zooming in on focus */
  }
  input:focus { outline: 3px solid var(--butter); outline-offset: -3px; }
  input::placeholder { color: var(--pill-hint); font-size: 1rem; }

  @keyframes rise {
    from { opacity: 0; translate: 0 6px; }
  }

  .screen {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    height: 100vh;
    height: 100dvh; /* dvh excludes the phone browser's address bar; vh is the fallback */
    padding: var(--gap);
  }
  .screen[hidden] { display: none; }

  h1 {
    padding: 14px 6px 6px;
    font-family: var(--title-font);
    font-size: clamp(2.4rem, 11vw, 3.25rem);
    font-weight: 700;
    line-height: 1;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }

  #greeting {
    padding: 14px 8px 8px;
    color: var(--muted);
  }

  .primary {
    flex-shrink: 0;
    min-height: 64px;
    border-radius: 32px;
    background: var(--butter);
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 600;
  }
  .primary:disabled {
    background: var(--card);
    color: var(--muted);
    cursor: default;
    filter: none;
    transform: none;
  }

  /* Bottom bar: back and settings stay in thumb reach, not up where the reference has them */
  .bottom-bar {
    display: flex;
    gap: var(--gap);
    flex-shrink: 0;
  }
  .bottom-bar .primary, .wide-pill { flex: 1; }
  .wide-pill {
    min-height: 64px;
    border-radius: 32px;
    font-size: 1.05rem;
  }

  .back {
    flex-shrink: 0;
    align-self: flex-start;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--pill);
    color: var(--ink);
    font-size: 1.5rem;
  }

  /* Setup screens */
  .setup-form {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }
  .setup-form input { padding: 0 22px; flex-shrink: 0; }
  .spacer { flex: 1; }

  #count-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    flex-shrink: 0;
  }
  #count-picker button {
    height: 56px;
    border-radius: 28px;
    background: var(--pill);
    color: var(--ink);
    font-size: 1.15rem;
  }
  #count-picker button.chosen { background: var(--butter); font-weight: 700; }

  #custom-names {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  #custom-names input { text-transform: uppercase; }
  #custom-names input::placeholder { text-transform: none; }

  /* Stacked cards on the split picker and landing screen, each overlapping the one above */
  .row-list {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .row {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 16px 0 22px;
    background: var(--colour);
    color: var(--ink);
    border-radius: 32px;
    font-family: var(--title-font);
    font-size: clamp(2.25rem, 10vw, 3rem);
    font-weight: 700;
    line-height: 1;
    text-align: left;
  }
  .row + .row { margin-top: -22px; }
  .row:active { transform: none; }
  .row::after {
    content: "↗";
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 44px;
    text-align: center;
  }
  .row small {
    display: block;
    margin-top: 2px;
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
    font-size: 0.85rem;
    font-weight: 400;
    line-height: 1.3;
  }

  /* Exercise screen */
  #bubbles {
    flex: 1;
    min-height: 0;
    overflow-y: auto; /* long lists scroll rather than shrinking past a tappable size */
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: minmax(84px, 1fr); /* rows share the height evenly when they fit */
    gap: var(--gap);
  }

  .bubble {
    display: flex;
    align-items: flex-start;
    padding: 14px;
    background: var(--colour);
    color: var(--ink);
    font-family: var(--title-font);
    font-size: clamp(1.35rem, 6vw, 1.9rem);
    font-weight: 700;
    line-height: 1.05;
    text-align: left;
    overflow-wrap: anywhere;
  }
  /* With an odd number of exercises, the last one spans the full width */
  .bubble:last-child:nth-child(odd) { grid-column: 1 / -1; }

  #no-exercises {
    grid-column: 1 / -1;
    align-self: center;
    color: var(--muted);
    text-align: center;
  }

  /* Settings screen */
  #settings-list {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .edit-row {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 64px;
    padding: 10px 22px;
    border-radius: 32px;
    font-family: var(--title-font);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.05;
    text-align: left;
  }
  .edit-row small {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--sky);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
    font-size: 0.8rem;
    font-weight: 400;
  }
  .quiet-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    flex-shrink: 0;
  }
  .quiet {
    flex-shrink: 0;
    min-height: 48px;
    background: none;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Popups: mid-screen for thumb reach, but above where the keypad opens */
  dialog {
    width: min(calc(100vw - 2 * var(--gap)), 420px);
    margin: 33vh auto auto;
    margin-top: 33dvh;
    padding: 0; /* so a click on the dialog itself can only mean the backdrop */
    background: var(--card);
    color: inherit;
    border: 0;
    border-radius: 32px;
    animation: rise 120ms ease-out;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); }

  #log form {
    display: grid;
    grid-template-columns: 1fr 1fr 64px;
    gap: var(--gap);
    padding: var(--gap);
  }
  /* Three inputs need the width, so the tick drops to its own full-width row */
  #log form.three-fields { grid-template-columns: repeat(3, 1fr); }
  #log form.three-fields #tick { grid-column: 1 / -1; }

  #log input {
    padding: 0;
    font-size: 1.5rem;
    text-align: center;
  }
  #log input::placeholder { font-size: 0.875rem; }

  #tick { height: 64px; min-height: 0; font-size: 1.75rem; }
  #tick:disabled { background: var(--line); }

  dialog.name-editor { margin-top: 18dvh; }

  .name-editor form {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: var(--gap);
  }
  .name-editor input { padding: 0 22px; text-transform: uppercase; }
  .name-editor input::placeholder { text-transform: none; }

  #type-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
  }
  #type-toggle button {
    height: 56px;
    border-radius: 28px;
    background: var(--line);
    color: var(--text);
  }
  #type-toggle button.chosen {
    background: var(--sky);
    color: var(--ink);
    font-weight: 600;
  }

  .name-editor p {
    min-height: 1.3em;
    padding: 0 8px;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.3;
  }
  .name-editor .primary:disabled { background: var(--line); }
  #editor-remove { color: var(--coral); }
  #editor-remove[hidden] { display: none; }

  #toast {
    position: fixed;
    top: 33vh;
    top: 33dvh;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    background: var(--butter);
    color: var(--ink);
    border-radius: 24px;
    font-size: 1.05rem;
    font-weight: 600;
    pointer-events: none; /* never blocks a tap on what's underneath */
    animation: rise 120ms ease-out;
  }
</style>
</head>
<body>

<main id="nickname-screen" class="screen" hidden>
  <h1>What's your nickname?</h1>
  <form id="nickname-form" class="setup-form">
    <input id="nickname-input" type="text" placeholder="e.g. Sam" aria-label="Nickname" maxlength="20" autocomplete="off">
    <div class="spacer"></div>
    <button id="nickname-done" class="primary" disabled>Continue</button>
  </form>
</main>

<main id="picker-screen" class="screen" hidden>
  <h1>How many splits do you do?</h1>
  <div class="row-list">
    <button class="row" style="--colour: var(--coral)" data-preset="3"><span>3<small>Push, pull, legs</small></span></button>
    <button class="row" style="--colour: var(--periwinkle)" data-preset="2"><span>2<small>Upper, lower</small></span></button>
    <button class="row" style="--colour: var(--butter)" data-preset="1"><span>1<small>All body</small></span></button>
    <button class="row" style="--colour: var(--sky)" data-go="custom"><span>CUSTOM<small>Pick how many and name them</small></span></button>
  </div>
  <button class="back" data-go="name" aria-label="Back">←</button>
</main>

<main id="custom-screen" class="screen" hidden>
  <h1>How many splits?</h1>
  <div id="count-picker">
    <button data-count="1">1</button>
    <button data-count="2">2</button>
    <button data-count="3">3</button>
    <button data-count="4">4</button>
    <button data-count="5">5</button>
    <button data-count="6">6</button>
    <button data-count="7">7</button>
    <button data-count="8">8</button>
  </div>
  <form id="custom-form" class="setup-form">
    <div id="custom-names"></div>
    <button id="custom-done" class="primary" disabled>Done</button>
  </form>
  <button class="back" data-go="" aria-label="Back">←</button>
</main>

<main id="landing" class="screen" hidden>
  <p id="greeting"></p>
  <div id="split-rows" class="row-list"></div>
</main>

<main id="exercises" class="screen" hidden>
  <h1 id="split-title"></h1>
  <div id="bubbles"></div>
  <div class="bottom-bar">
    <button class="back" data-go="" aria-label="Back">←</button>
    <button id="settings-link" class="wide-pill">SETTINGS</button>
  </div>
</main>

<main id="settings" class="screen" hidden>
  <h1 id="settings-title"></h1>
  <div id="settings-list"></div>
  <div class="quiet-row">
    <button id="rename-split" class="quiet">Rename split</button>
    <button id="redo-setup" class="quiet">Redo setup</button>
  </div>
  <div class="bottom-bar">
    <button id="settings-back" class="back" aria-label="Back">←</button>
    <button class="primary" data-add>+ ADD EXERCISE</button>
  </div>
</main>

<dialog id="log">
  <form>
    <input type="text" autocomplete="off" autofocus>
    <input type="text" autocomplete="off">
    <input type="text" autocomplete="off" hidden>
    <button id="tick" class="primary" aria-label="Log set" disabled>✓</button>
  </form>
</dialog>

<dialog id="editor" class="name-editor">
  <form>
    <input id="editor-name" type="text" placeholder="Exercise name" aria-label="Exercise name" maxlength="40" autocomplete="off">
    <div id="type-toggle">
      <button type="button" data-type="strength">reps + kg</button>
      <button type="button" data-type="cardio">cardio</button>
    </div>
    <p id="editor-hint"></p>
    <button id="editor-save" class="primary">SAVE</button>
    <button id="editor-remove" type="button" class="quiet">Remove from this split</button>
  </form>
</dialog>

<dialog id="split-editor" class="name-editor">
  <form>
    <input id="split-name" type="text" placeholder="Split name" aria-label="Split name" maxlength="20" autocomplete="off">
    <p id="split-hint"></p>
    <button id="split-save" class="primary">SAVE</button>
  </form>
</dialog>

<div id="toast" role="status" hidden></div>

<script>
  // Starting exercises for new users. They get cleaned into caps on the way in.
  const PUSH = ["Chest press machine", "Incline chest press machine", "Pec fly machine", "Shoulder press machine", "Lateral raise with free-weights", "Rope pushdown"];
  const PULL = ["Fixed lat pulldown machine", "Seated cable row", "Reverse fly", "Bicep curl machine", "Hammer curl"];
  const LEGS = ["Leg press", "Leg extension", "Hip abduction machine", "Hip adduction machine", "Hip thrust or glute machine", "Dumbbell Romanian deadlift", "Leg curls", "Calf raise machine"];
  const FINISHERS = ["Ab crunch machine", "Treadmill incline walk"]; // end every split

  const SPLIT_PRESETS = {
    3: [["Push", PUSH], ["Pull", PULL], ["Legs", LEGS]],
    2: [["Upper", [...PUSH, ...PULL]], ["Lower", LEGS]],
    1: [["All body", [...PUSH, ...PULL, ...LEGS]]],
  };

  // What the popup inputs ask for (up to three). `whole` means no decimals.
  const STRENGTH_FIELDS = [
    { key: "reps", placeholder: "reps", label: "Reps", min: 1, whole: true },
    { key: "weight", placeholder: "weight", label: "Weight in kg", min: 0 },
  ];
  const CARDIO_FIELDS = [
    { key: "incline", placeholder: "incline %", label: "Incline percent", min: 0 },
    { key: "speed", placeholder: "km/h", label: "Speed in km/h", min: 0.1 },
    { key: "minutes", placeholder: "mins", label: "Time in minutes", min: 1, whole: true },
  ];

  const SPLIT_COLOURS = ["--coral", "--periwinkle", "--butter", "--sky", "--sage"];

  // Caps and tidy spacing, so "treadmill " and "TREADMILL" are the same exercise.
  function cleanName(name) {
    return name.trim().replace(/\s+/g, " ").toUpperCase();
  }

  // All storage lives in these functions, so it's easy to swap out later.
  // Sets are grouped by exercise name, not split, so an exercise that appears
  // in several splits keeps one history:
  // { nickname: "Sam", splits: [{ name: "PUSH", exercises: ["ROPE PUSHDOWN"] }],
  //   cardio: ["TREADMILL INCLINE WALK"],
  //   sets: { "ROPE PUSHDOWN": [{ id, date: "2026-11-02", reps: 8, weight: 40 }] } }
  const STORAGE_KEY = "gymTracker.v2";
  const OLD_STORAGE_KEY = "gymTracker.v1";

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : migrateOldData();
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // Carries v1 sets into the new shape. The v1 copy stays put as a backup.
  function migrateOldData() {
    const data = { nickname: null, splits: null, cardio: [cleanName("Treadmill incline walk")], sets: {} };
    const old = localStorage.getItem(OLD_STORAGE_KEY);
    if (old) {
      for (const { category, exercise, ...set } of JSON.parse(old).entries) {
        const name = cleanName(exercise);
        data.sets[name] = data.sets[name] || [];
        data.sets[name].push(set);
      }
    }
    return data;
  }

  // Renames everywhere: every split it's in, its logged sets, and its type.
  // If the new name already exists, the two exercises become one.
  function renameExercise(data, oldName, newName) {
    for (const split of data.splits) {
      split.exercises = [...new Set(split.exercises.map((name) => (name === oldName ? newName : name)))];
    }
    if (data.sets[oldName]) {
      data.sets[newName] = [...(data.sets[newName] || []), ...data.sets[oldName]]
        .sort((a, b) => a.date.localeCompare(b.date));
      delete data.sets[oldName];
    }
    data.cardio = data.cardio.filter((name) => name !== oldName);
  }

  function setExerciseType(data, name, type) {
    data.cardio = data.cardio.filter((cardioName) => cardioName !== name);
    if (type === "cardio") data.cardio.push(name);
  }

  function exerciseExists(data, name) {
    return Boolean(data.sets[name]) || data.splits.some((split) => split.exercises.includes(name));
  }

  // Load, change, save. Returns false (and says so) if the save fails.
  function updateData(change) {
    try {
      const data = loadData();
      change(data);
      saveData(data);
      return true;
    } catch {
      showToast("not saved");
      return false;
    }
  }

  const screens = [...document.querySelectorAll(".screen")];
  const nicknameInput = document.getElementById("nickname-input");
  const nicknameDone = document.getElementById("nickname-done");
  const customNames = document.getElementById("custom-names");
  const customDone = document.getElementById("custom-done");
  const countButtons = [...document.querySelectorAll("[data-count]")];
  const splitRows = document.getElementById("split-rows");
  const splitTitle = document.getElementById("split-title");
  const bubbles = document.getElementById("bubbles");
  const settingsLink = document.getElementById("settings-link");
  const settingsList = document.getElementById("settings-list");
  const editor = document.getElementById("editor");
  const editorName = document.getElementById("editor-name");
  const editorHint = document.getElementById("editor-hint");
  const editorSave = document.getElementById("editor-save");
  const editorRemove = document.getElementById("editor-remove");
  const typeButtons = [...document.querySelectorAll("[data-type]")];
  const splitEditor = document.getElementById("split-editor");
  const splitNameInput = document.getElementById("split-name");
  const splitHint = document.getElementById("split-hint");
  const splitSave = document.getElementById("split-save");
  const logDialog = document.getElementById("log");
  const logForm = logDialog.querySelector("form");
  const logInputs = [...logForm.querySelectorAll("input")];
  const tick = document.getElementById("tick");
  const toast = document.getElementById("toast");

  let currentExercise = null;
  let currentFields = STRENGTH_FIELDS;
  let currentSplit = null;
  let editingName = null; // null means the editor is adding a new exercise
  let editorType = "strength";
  let toastTimer;

  function showOnly(id) {
    screens.forEach((screen) => { screen.hidden = screen.id !== id; });
  }

  function renderLanding(data) {
    document.getElementById("greeting").textContent = `Hi, ${data.nickname}!`;
    splitRows.replaceChildren(...data.splits.map((split, i) => {
      const row = document.createElement("button");
      row.className = "row";
      row.dataset.split = i;
      row.style.setProperty("--colour", splitColour(i));
      const name = document.createElement("span");
      name.textContent = split.name;
      row.append(name);
      return row;
    }));
  }

  function splitColour(index) {
    return `var(${SPLIT_COLOURS[index % SPLIT_COLOURS.length]})`;
  }

  function renderExercises(split, index) {
    splitTitle.textContent = split.name;
    settingsLink.dataset.go = `${index}/settings`;
    bubbles.style.setProperty("--colour", splitColour(index));
    if (split.exercises.length === 0) {
      const message = document.createElement("p");
      message.id = "no-exercises";
      message.textContent = "No exercises yet. Add some in settings.";
      bubbles.replaceChildren(message);
      return;
    }
    bubbles.replaceChildren(...split.exercises.map((name) => {
      const bubble = document.createElement("button");
      bubble.className = "bubble";
      bubble.dataset.exercise = name;
      bubble.textContent = name;
      return bubble;
    }));
  }

  function renderSettings(data, split, index) {
    document.getElementById("settings-title").textContent = `${split.name} settings`;
    document.getElementById("settings-back").dataset.go = index;
    settingsList.replaceChildren(...split.exercises.map((name) => {
      const row = document.createElement("button");
      row.className = "edit-row";
      row.dataset.edit = name;
      const label = document.createElement("span");
      label.textContent = name;
      row.append(label);
      if (data.cardio.includes(name)) {
        const tag = document.createElement("small");
        tag.textContent = "cardio";
        row.append(tag);
      }
      return row;
    }));
  }

  // The saved data and URL hash together decide which screen shows, so the
  // phone's own back gesture and a page refresh both work without any extra code.
  // Splits are addressed by position ("#0", "#0/settings") because their names can be anything.
  function showScreen() {
    const route = location.hash.slice(1);
    const data = loadData();
    const splitRoute = route.match(/^(\d+)(\/settings)?$/);
    const split = data.splits && splitRoute && data.splits[splitRoute[1]];

    // The back gesture shouldn't leave a popup floating over another screen.
    logDialog.close();
    editor.close();
    splitEditor.close();

    if (!data.nickname || route === "name") {
      nicknameInput.value = data.nickname || "";
      updateNicknameDone();
      showOnly("nickname-screen");
    } else if (!data.splits) {
      showOnly(route === "custom" ? "custom-screen" : "picker-screen");
    } else if (split) {
      currentSplit = Number(splitRoute[1]);
      if (splitRoute[2]) {
        renderSettings(data, split, currentSplit);
        showOnly("settings");
      } else {
        renderExercises(split, currentSplit);
        showOnly("exercises");
      }
    } else {
      renderLanding(data);
      showOnly("landing");
    }
  }

  function go(route) {
    if (location.hash.slice(1) === route) showScreen();
    else location.hash = route;
  }

  function updateNicknameDone() {
    nicknameDone.disabled = nicknameInput.value.trim() === "";
  }

  function choosePreset(count) {
    const splits = SPLIT_PRESETS[count].map(([name, exercises]) => ({
      name: cleanName(name),
      exercises: [...exercises, ...FINISHERS].map(cleanName),
    }));
    if (updateData((data) => { data.splits = splits; })) go("");
  }

  // Re-renders the name boxes for a new count, keeping anything already typed.
  function renderCustomNames(count) {
    const typed = [...customNames.children].map((input) => input.value);
    countButtons.forEach((button) => button.classList.toggle("chosen", Number(button.dataset.count) === count));
    customNames.replaceChildren(...Array.from({ length: count }, (_, i) => {
      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = 20;
      input.autocomplete = "off";
      input.placeholder = `Split ${i + 1} name`;
      input.setAttribute("aria-label", `Split ${i + 1} name`);
      input.value = typed[i] || "";
      return input;
    }));
    updateCustomDone();
  }

  // Every box filled, and no two names the same once they're in caps.
  function customSplitNames() {
    const names = [...customNames.children].map((input) => cleanName(input.value));
    const valid = names.length > 0 && names.every(Boolean) && new Set(names).size === names.length;
    return valid ? names : null;
  }

  function updateCustomDone() {
    customDone.disabled = !customSplitNames();
  }

  function openEditor(name) {
    const data = loadData();
    editingName = name;
    editorName.value = name || "";
    setEditorType(data.cardio.includes(name) ? "cardio" : "strength");
    editorRemove.hidden = !name;
    updateEditor();
    editor.showModal();
  }

  function setEditorType(type) {
    editorType = type;
    typeButtons.forEach((button) => button.classList.toggle("chosen", button.dataset.type === type));
  }

  function updateEditor() {
    const data = loadData();
    const name = cleanName(editorName.value);
    const adding = editingName === null;
    const alreadyHere = adding && data.splits[currentSplit].exercises.includes(name);

    let hint = "";
    if (alreadyHere) {
      hint = "Already in this split.";
    } else if (!adding) {
      hint = "Renames it in every split.";
    } else if (exerciseExists(data, name)) {
      hint = "Already exists, so it keeps its logged sets.";
      setEditorType(data.cardio.includes(name) ? "cardio" : "strength");
    }
    editorHint.textContent = hint;
    editorSave.disabled = !name || alreadyHere;
  }

  function saveEditor() {
    const name = cleanName(editorName.value);
    const renaming = editingName !== null && name !== editingName;
    if (renaming && exerciseExists(loadData(), name)
        && !confirm(`${name} already exists. Merge them? Their logged sets get combined.`)) return;

    const saved = updateData((data) => {
      if (renaming) renameExercise(data, editingName, name);
      if (editingName === null) data.splits[currentSplit].exercises.push(name);
      setExerciseType(data, name, editorType);
    });
    if (saved) showScreen();
  }

  function openSplitEditor() {
    splitNameInput.value = loadData().splits[currentSplit].name;
    updateSplitEditor();
    splitEditor.showModal();
  }

  function updateSplitEditor() {
    const name = cleanName(splitNameInput.value);
    const taken = loadData().splits.some((split, i) => split.name === name && i !== currentSplit);
    splitHint.textContent = taken ? "Another split has this name." : "";
    splitSave.disabled = !name || taken;
  }

  function openLog(exercise) {
    currentExercise = exercise;
    currentFields = loadData().cardio.includes(exercise) ? CARDIO_FIELDS : STRENGTH_FIELDS;
    logForm.reset();
    logForm.classList.toggle("three-fields", currentFields.length === 3);
    logInputs.forEach((input, i) => {
      const field = currentFields[i];
      input.hidden = !field;
      if (!field) return;
      input.placeholder = field.placeholder;
      input.setAttribute("aria-label", field.label);
      input.inputMode = field.whole ? "numeric" : "decimal";
    });
    updateTick();
    logDialog.showModal();
  }

  // Local date, not UTC: toISOString() would put a morning east of UTC on yesterday.
  function todayLocal() {
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${now.getFullYear()}-${month}-${day}`;
  }

  function isValidSet() {
    return currentFields.every((field, i) => {
      const value = logInputs[i].value;
      return value !== "" && Number.isFinite(Number(value)) && Number(value) >= field.min;
    });
  }

  function updateTick() {
    tick.disabled = !isValidSet();
  }

  function logSet() {
    const set = {
      // Not crypto.randomUUID(): browsers only allow it on https, which would break phone testing.
      id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
      date: todayLocal(),
    };
    currentFields.forEach((field, i) => { set[field.key] = Number(logInputs[i].value); });

    const saved = updateData((data) => {
      data.sets[currentExercise] = data.sets[currentExercise] || [];
      data.sets[currentExercise].push(set);
    });
    if (saved) showToast("logged");
    logDialog.close();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 1200);
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.go !== undefined) go(button.dataset.go);
    if (button.dataset.preset) choosePreset(button.dataset.preset);
    if (button.dataset.count) renderCustomNames(Number(button.dataset.count));
    if (button.dataset.split) go(button.dataset.split);
    if (button.dataset.exercise) openLog(button.dataset.exercise);
    if (button.dataset.edit) openEditor(button.dataset.edit);
    if (button.dataset.add !== undefined) openEditor(null);
    if (button.dataset.type) setEditorType(button.dataset.type);
  });

  nicknameInput.addEventListener("input", updateNicknameDone);

  document.getElementById("nickname-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const nickname = nicknameInput.value.trim();
    if (nickname && updateData((data) => { data.nickname = nickname; })) go("");
  });

  customNames.addEventListener("input", updateCustomDone);

  document.getElementById("custom-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const names = customSplitNames();
    if (!names) return;
    const splits = names.map((name) => ({ name, exercises: [] }));
    if (updateData((data) => { data.splits = splits; })) go("");
  });

  editorName.addEventListener("input", updateEditor);

  editor.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!editorSave.disabled) saveEditor();
  });

  // Only this split's list changes. Sets stay, so adding it back brings them back.
  editorRemove.addEventListener("click", () => {
    const saved = updateData((data) => {
      const split = data.splits[currentSplit];
      split.exercises = split.exercises.filter((name) => name !== editingName);
    });
    if (saved) showScreen();
  });

  document.getElementById("rename-split").addEventListener("click", openSplitEditor);

  splitNameInput.addEventListener("input", updateSplitEditor);

  // Sets are stored by exercise, so renaming a split doesn't touch them.
  splitEditor.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (splitSave.disabled) return;
    const name = cleanName(splitNameInput.value);
    if (updateData((data) => { data.splits[currentSplit].name = name; })) showScreen();
  });

  document.getElementById("redo-setup").addEventListener("click", () => {
    if (!confirm("Pick your splits again? Your exercise lists reset, but logged sets are kept.")) return;
    if (updateData((data) => { data.splits = null; })) go("");
  });

  // Filter as you type, because inputmode only picks the keypad: a laptop keyboard
  // or a paste could still put letters in.
  logInputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      if (currentFields[i].whole) {
        input.value = input.value.replace(/\D/g, "");
      } else {
        const [whole, ...decimals] = input.value
          .replace(/,/g, ".") // some phone keypads offer a comma as the decimal key
          .replace(/[^\d.]/g, "")
          .split(".");
        input.value = decimals.length ? `${whole}.${decimals.join("")}` : whole;
      }
      updateTick();
    });
  });

  logForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (isValidSet()) logSet();
  });

  // Tapping outside a popup closes it without saving.
  for (const dialog of [logDialog, editor, splitEditor]) {
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  }

  window.addEventListener("hashchange", showScreen);
  try {
    showScreen();
  } catch {
    // Unreadable saved data: say so, and don't offer setup, which would overwrite it.
    document.body.textContent = "Couldn't read your saved data.";
  }
</script>
</body>
</html>
