<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym Buddy</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; }

  /* Based on desired-ui.webp: charcoal screens, loud flat cards, white pill controls.
     System fonts only, so it loads instantly and works with no signal at the gym. */
  :root {
    --bg: #201f22;
    --card: #2f2e31;
    --line: #47464b;
    --text: #f6f5f2;
    --muted: #a9a8ad;
    --ink: #1c1b1e;
    --pill: #f6f5f2;
    --pill-hint: #66656b;
    --coral: #f5644f;
    --periwinkle: #7b7bf7;
    --butter: #f8cb62;
    --sky: #b5ecfa;
    --sage: #bfd0c4;
    --title-font: "DIN Condensed", "Bahnschrift Condensed", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", sans-serif;
    --gap: 10px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
  }

  button {
    background: var(--card);
    border: 0;
    border-radius: 28px;
    color: inherit;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation; /* removes the double-tap-zoom delay on phones */
    transition: transform 80ms, filter 80ms;
  }
  button:active { filter: brightness(0.88); transform: scale(0.98); }

  input {
    width: 100%;
    min-width: 0;
    height: 64px;
    background: var(--pill);
    border: 0;
    border-radius: 32px;
    color: var(--ink);
    font: inherit;
    font-size: 1.15rem; /* 16px or more also stops iPhones zooming in on focus */
  }
  input:focus { outline: 3px solid var(--butter); outline-offset: -3px; }
  input::placeholder { color: var(--pill-hint); font-size: 1rem; }

  @keyframes rise {
    from { opacity: 0; translate: 0 6px; }
  }

  .screen {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    height: 100vh;
    height: 100dvh; /* dvh excludes the phone browser's address bar; vh is the fallback */
    padding: var(--gap);
  }
  .screen[hidden] { display: none; }

  h1 {
    padding: 14px 6px 6px;
    font-family: var(--title-font);
    font-size: clamp(2.4rem, 11vw, 3.25rem);
    font-weight: 700;
    line-height: 1;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }

  .hint {
    padding: 0 8px;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.3;
  }

  #greeting {
    padding: 14px 8px 8px;
    color: var(--muted);
  }

  .primary {
    flex-shrink: 0;
    min-height: 64px;
    border-radius: 32px;
    background: var(--butter);
    color: var(--ink);
    font-size: 1.05rem;
    font-weight: 600;
  }
  .primary:disabled {
    background: var(--card);
    color: var(--muted);
    cursor: default;
    filter: none;
    transform: none;
  }

  /* Bottom bar: back and settings stay in thumb reach, not up where the reference has them */
  .bottom-bar {
    display: flex;
    gap: var(--gap);
    flex-shrink: 0;
  }
  .bottom-bar .primary, .wide-pill { flex: 1; }
  .wide-pill {
    min-height: 64px;
    border-radius: 32px;
    font-size: 1.05rem;
  }

  .back {
    flex-shrink: 0;
    align-self: flex-start;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--pill);
    color: var(--ink);
    font-size: 1.5rem;
  }

  /* Setup screens */
  .setup-form {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }
  .setup-form input { padding: 0 22px; flex-shrink: 0; }
  .spacer { flex: 1; }

  .setup-form #split-count {
    height: 96px;
    padding: 0;
    font-family: var(--title-font);
    font-size: 3.5rem;
    font-weight: 700;
    text-align: center;
  }
  #split-count::placeholder { font-size: 1.25rem; }
  .setup-form .bottom-bar { margin-top: auto; }

  #custom-names {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  #custom-names[hidden] { display: none; }
  #custom-names input { text-transform: uppercase; }
  #custom-names input::placeholder { text-transform: none; }

  /* Stacked cards on the landing screen, each overlapping the one above */
  .row-list {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .row {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 16px 0 22px;
    background: var(--colour);
    color: var(--ink);
    border-radius: 32px;
    font-family: var(--title-font);
    font-size: clamp(2.25rem, 10vw, 3rem);
    font-weight: 700;
    line-height: 1;
    text-align: left;
  }
  .row + .row { margin-top: -22px; }
  .row:active { transform: none; }
  .row::after {
    content: "↗";
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 44px;
    text-align: center;
  }
  /* Exercise screen */
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .title-row h1 { min-width: 0; }
  #reorder-toggle {
    flex-shrink: 0;
    min-height: 48px;
    padding: 0 18px;
    border-radius: 24px;
    background: var(--pill);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 600;
  }
  #reorder-toggle[hidden] { display: none; }
  #reorder-toggle.chosen { background: var(--butter); }
  .edit-line .bubble { flex: 1 0 0; min-width: 0; cursor: default; }
  .edit-line .bubble:active { filter: none; transform: none; }

  #bubbles {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .bubble {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    min-height: 76px;
    padding: 10px 22px;
    background: var(--colour);
    color: var(--ink);
    font-family: var(--title-font);
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    font-weight: 700;
    line-height: 1.05;
    text-align: left;
    overflow-wrap: anywhere;
  }

  #add-first { margin: auto 0; min-height: 96px; }

  /* Settings and history screens */
  .edit-list {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .edit-line {
    flex-shrink: 0;
    display: flex;
    gap: 6px;
  }
  .move {
    flex-shrink: 0;
    width: 48px;
    border-radius: 24px;
    font-size: 1.15rem;
  }
  .move:disabled { color: var(--line); cursor: default; filter: none; transform: none; }
  .delete { color: var(--coral); }
  .section-label { padding: 6px 8px 0; }
  #nickname-row { flex: 0 0 auto; }

  .edit-row {
    flex: 1 0 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 64px;
    padding: 10px 22px;
    border-radius: 32px;
    font-family: var(--title-font);
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.05;
    text-align: left;
  }
  .edit-list > .edit-row { flex: 0 0 auto; } /* in a line it shares the width; alone it keeps its height */

  .edit-row .set-date {
    display: block;
    margin-top: 3px;
    padding: 0;
    background: none;
    color: var(--muted);
  }
  .edit-row small {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--sky);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
    font-size: 0.8rem;
    font-weight: 400;
  }
  .quiet {
    flex-shrink: 0;
    min-height: 48px;
    background: none;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* Popups: mid-screen for thumb reach, but above where the keypad opens */
  dialog {
    width: min(calc(100vw - 2 * var(--gap)), 420px);
    margin: 33vh auto auto;
    margin-top: 33dvh;
    padding: 0; /* so a click on the dialog itself can only mean the backdrop */
    background: var(--card);
    color: inherit;
    border: 0;
    border-radius: 32px;
    animation: rise 120ms ease-out;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); }

  #log form {
    display: grid;
    grid-template-columns: 1fr 1fr 64px;
    gap: var(--gap);
    padding: var(--gap);
  }
  /* Three inputs need the width, so the tick drops to its own full-width row */
  #log form.three-fields { grid-template-columns: repeat(3, 1fr); }
  #log form.three-fields #tick { grid-column: 1 / -1; }

  #log input {
    padding: 0;
    font-size: 1.5rem;
    text-align: center;
  }
  #log input::placeholder { font-size: 0.875rem; }

  #log .quiet { grid-column: 1 / -1; }
  #log-delete { color: var(--coral); }

  #tick { height: 64px; min-height: 0; font-size: 1.75rem; }
  #tick:disabled { background: var(--line); }

  dialog.name-editor { margin-top: 18dvh; }

  .name-editor form {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: var(--gap);
  }
  .name-editor input { padding: 0 22px; text-transform: uppercase; }
  .name-editor input::placeholder { text-transform: none; }
  .name-editor #new-nickname { text-transform: none; } /* nicknames show as typed */

  .toggle {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
  }
  .toggle button {
    height: 56px;
    border-radius: 28px;
    background: var(--line);
    color: var(--text);
  }
  .toggle button.chosen {
    background: var(--sky);
    color: var(--ink);
    font-weight: 600;
  }

  .name-editor p {
    min-height: 1.3em;
    padding: 0 8px;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.3;
  }
  .name-editor .primary:disabled { background: var(--line); }

  #toast {
    position: fixed;
    top: 33vh;
    top: 33dvh;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    background: var(--butter);
    color: var(--ink);
    border-radius: 24px;
    font-size: 1.05rem;
    font-weight: 600;
    pointer-events: none; /* never blocks a tap on what's underneath */
    animation: rise 120ms ease-out;
  }
</style>
</head>
<body>

<main id="nickname-screen" class="screen" hidden>
  <h1>What's your nickname?</h1>
  <form id="nickname-form" class="setup-form">
    <input id="nickname-input" type="text" placeholder="e.g. Sam" aria-label="Nickname" maxlength="20" autocomplete="off">
    <p id="nickname-hint" class="hint"></p>
    <div class="spacer"></div>
    <button id="nickname-done" class="primary" disabled>Continue</button>
  </form>
</main>

<main id="setup-screen" class="screen" hidden>
  <h1>How many splits?</h1>
  <form id="custom-form" class="setup-form">
    <input id="split-count" type="text" inputmode="numeric" maxlength="1" placeholder="1 to 8" aria-label="Number of splits" autocomplete="off">
    <p id="setup-hint" class="hint"></p>
    <div id="custom-names" hidden></div>
    <div class="bottom-bar">
      <button id="setup-back" type="button" class="back" data-go="name" aria-label="Back">←</button>
      <button id="custom-done" class="primary" disabled>Done</button>
    </div>
  </form>
</main>

<main id="landing" class="screen" hidden>
  <p id="greeting"></p>
  <p id="sync-status" class="hint" hidden></p>
  <div id="split-rows" class="row-list"></div>
  <div class="bottom-bar">
    <button class="wide-pill" data-go="settings">SETTINGS</button>
  </div>
</main>

<main id="app-settings" class="screen" hidden>
  <h1>Settings</h1>
  <p class="hint section-label">Your nickname</p>
  <button id="nickname-row" class="edit-row"></button>
  <p class="hint section-label">Which box comes first when logging</p>
  <div class="toggle">
    <button data-order="reps">reps first</button>
    <button data-order="weight">weight first</button>
  </div>
  <p class="hint section-label">Your splits</p>
  <div id="split-list" class="edit-list"></div>
  <button id="redo-setup" class="quiet">Redo setup</button>
  <div class="bottom-bar">
    <button class="back" data-go="" aria-label="Back">←</button>
    <button id="add-split" class="primary" data-add-split>+ ADD SPLIT</button>
  </div>
</main>

<main id="exercises" class="screen" hidden>
  <div class="title-row">
    <h1 id="split-title"></h1>
    <button id="reorder-toggle">REORDER</button>
  </div>
  <div id="bubbles"></div>
  <div class="bottom-bar">
    <button class="back" data-go="" aria-label="Back">←</button>
    <button id="settings-link" class="wide-pill">SETTINGS</button>
  </div>
</main>

<main id="settings" class="screen" hidden>
  <h1 id="settings-title"></h1>
  <div id="settings-list" class="edit-list"></div>
  <div class="bottom-bar">
    <button id="settings-back" class="back" aria-label="Back">←</button>
    <button class="primary" data-add>+ ADD EXERCISE</button>
  </div>
</main>

<main id="history" class="screen" hidden>
  <h1 id="history-title"></h1>
  <div id="history-list" class="edit-list"></div>
  <button id="history-back" class="back" aria-label="Back">←</button>
</main>

<dialog id="log">
  <form>
    <input type="text" autocomplete="off" autofocus>
    <input type="text" autocomplete="off">
    <input type="text" autocomplete="off" hidden>
    <button id="tick" class="primary" aria-label="Save set" disabled>✓</button>
    <button id="log-history" type="button" class="quiet">History</button>
    <button id="log-delete" type="button" class="quiet">Delete this set</button>
  </form>
</dialog>

<dialog id="editor" class="name-editor">
  <form>
    <input id="editor-name" type="text" placeholder="Exercise name" aria-label="Exercise name" maxlength="40" autocomplete="off">
    <div class="toggle">
      <button type="button" data-type="strength">reps + kg</button>
      <button type="button" data-type="cardio">cardio</button>
    </div>
    <p id="editor-hint"></p>
    <button id="editor-save" class="primary">SAVE</button>
  </form>
</dialog>

<dialog id="split-editor" class="name-editor">
  <form>
    <input id="split-name" type="text" placeholder="Split name" aria-label="Split name" maxlength="20" autocomplete="off">
    <p id="split-hint"></p>
    <button id="split-save" class="primary">SAVE</button>
  </form>
</dialog>

<dialog id="nickname-editor" class="name-editor">
  <form>
    <input id="new-nickname" type="text" placeholder="New nickname" aria-label="New nickname" maxlength="20" autocomplete="off">
    <p id="new-nickname-hint"></p>
    <button id="new-nickname-save" class="primary">SAVE</button>
  </form>
</dialog>

<div id="toast" role="status" hidden></div>

<script>
  // Starting exercises for new users. They get cleaned into caps on the way in.
  const PUSH = ["Chest press machine", "Incline chest press machine", "Pec fly machine", "Shoulder press machine", "Lateral raise with free-weights", "Rope pushdown"];
  const PULL = ["Fixed lat pulldown machine", "Seated cable row", "Reverse fly", "Bicep curl machine", "Hammer curl"];
  const LEGS = ["Leg press", "Leg extension", "Hip abduction machine", "Hip adduction machine", "Hip thrust or glute machine", "Dumbbell Romanian deadlift", "Leg curls", "Calf raise machine"];
  const FINISHERS = ["Ab crunch machine", "Treadmill incline walk"]; // end every split

  const SPLIT_PRESETS = {
    3: [["Push", PUSH], ["Pull", PULL], ["Legs", LEGS]],
    2: [["Upper", [...PUSH, ...PULL]], ["Lower", LEGS]],
    1: [["All body", [...PUSH, ...PULL, ...LEGS]]],
  };

  // What the popup inputs ask for (up to three). `whole` means no decimals.
  // `blankIsZero` lets the box stay empty, and `zeroHint` is how a past 0 gets described.
  const STRENGTH_FIELDS = [
    { key: "reps", placeholder: "reps", unit: " reps", label: "Reps", min: 1, whole: true },
    { key: "weight", placeholder: "weight", unit: " kg", label: "Weight in kg", min: 0, blankIsZero: true, zeroHint: "bodyweight" },
  ];
  const CARDIO_FIELDS = [
    { key: "incline", placeholder: "incline %", unit: "%", label: "Incline percent", min: 0 },
    { key: "speed", placeholder: "km/h", unit: " km/h", label: "Speed in km/h", min: 0.1 },
    { key: "minutes", placeholder: "mins", unit: " mins", label: "Time in minutes", min: 1, whole: true },
  ];

  const SPLIT_COLOURS = ["--coral", "--periwinkle", "--butter", "--sky", "--sage"];

  // Caps and tidy spacing, so "treadmill " and "TREADMILL" are the same exercise.
  function cleanName(name) {
    return name.trim().replace(/\s+/g, " ").toUpperCase();
  }

  // All storage lives in these functions, so it's easy to swap out later.
  // Sets are grouped by exercise name, not split, so an exercise that appears
  // in several splits keeps one history:
  // { nickname: "Sam", splits: [{ name: "PUSH", exercises: ["ROPE PUSHDOWN"] }],
  //   cardio: ["TREADMILL INCLINE WALK"],
  //   sets: { "ROPE PUSHDOWN": [{ id, date: "2026-11-02", reps: 8, weight: 40 }] } }
  const STORAGE_KEY = "gymTracker.v2";
  const OLD_STORAGE_KEY = "gymTracker.v1";
  const UNSYNCED_KEY = "gymTracker.v2.unsynced"; // set while the phone has changes not yet online

  // Each person's data is one online record under a hidden ID, so their name is just a label.
  // A second small record maps each nickname to that ID, which is how they get back in after a wipe.
  // This key only identifies the project, so it's fine in public code. The database rules control access.
  const DATABASE_URL = "https://firestore.googleapis.com/v1/projects/gymbuddy-84fce/databases/(default)/documents";
  const API_KEY = "AIzaSyDuTO0RnC3kb_Ik1TcG0dj6L8qcv0sCoJA";
  const SYNC_TIMEOUT_MS = 10000;

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : migrateOldData();
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // Carries v1 sets into the new shape. The v1 copy stays put as a backup.
  function migrateOldData() {
    const data = { nickname: null, splits: null, cardio: [cleanName("Treadmill incline walk")], sets: {} };
    const old = localStorage.getItem(OLD_STORAGE_KEY);
    if (old) {
      for (const { category, exercise, ...set } of JSON.parse(old).entries) {
        const name = cleanName(exercise);
        data.sets[name] = data.sets[name] || [];
        data.sets[name].push(set);
      }
    }
    return data;
  }

  // Renames everywhere: every split it's in, its logged sets, and its type.
  // If the new name already exists, the two exercises become one.
  function renameExercise(data, oldName, newName) {
    for (const split of data.splits) {
      split.exercises = [...new Set(split.exercises.map((name) => (name === oldName ? newName : name)))];
    }
    if (data.sets[oldName]) {
      data.sets[newName] = [...(data.sets[newName] || []), ...data.sets[oldName]]
        .sort((a, b) => a.date.localeCompare(b.date));
      delete data.sets[oldName];
    }
    data.cardio = data.cardio.filter((name) => name !== oldName);
  }

  function setExerciseType(data, name, type) {
    data.cardio = data.cardio.filter((cardioName) => cardioName !== name);
    if (type === "cardio") data.cardio.push(name);
  }

  function exerciseExists(data, name) {
    return Boolean(data.sets[name]) || data.splits.some((split) => split.exercises.includes(name));
  }

  function newUserId() {
    // Not crypto.randomUUID(): browsers only allow it on https, which would break phone testing.
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return `p_${[...bytes].map((byte) => byte.toString(16).padStart(2, "0")).join("")}`;
  }

  // Load, change, save, then back it up online. Returns false (and says so) if the save fails.
  // changesSetup marks edits to splits and exercises, so the newest version wins between phones.
  function updateData(change, changesSetup = true) {
    try {
      const data = loadData();
      change(data);
      if (changesSetup) data.changedAt = Date.now();
      saveData(data);
      localWrites++;
      localStorage.setItem(UNSYNCED_KEY, "1");
      syncNow();
      return true;
    } catch {
      showToast("not saved");
      return false;
    }
  }

  // Online copy. Plain web requests, so the app doesn't need Firebase's code library.
  function recordUrl(collection, id) {
    return `${DATABASE_URL}/${collection}/${encodeURIComponent(id)}?key=${API_KEY}`;
  }

  // The prefixes avoid IDs the database reserves, and the encoding keeps "/" and friends safe.
  function nicknameId(nickname) {
    return `n_${encodeURIComponent(cleanName(nickname))}`;
  }

  // Returns a record's fields, or null if it doesn't exist. Throws if it can't tell.
  async function fetchRecord(collection, id) {
    const response = await fetch(recordUrl(collection, id), { signal: AbortSignal.timeout(SYNC_TIMEOUT_MS) });
    if (response.status === 404) return null;
    if (!response.ok) throw new Error(`Load failed: ${response.status}`);
    return (await response.json()).fields;
  }

  function writeRecord(collection, id, fields) {
    return fetch(recordUrl(collection, id), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields }),
      signal: AbortSignal.timeout(SYNC_TIMEOUT_MS),
    });
  }

  async function fetchProfile(userId) {
    const fields = await fetchRecord("users", userId);
    if (!fields) return null;
    const profile = JSON.parse(fields.data.stringValue);
    if (!profile.nickname || !profile.sets || !Array.isArray(profile.cardio)) throw new Error("Bad profile");
    return profile;
  }

  async function uploadProfile(data, userId = data.userId) {
    const response = await writeRecord("users", userId, { data: { stringValue: JSON.stringify(data) } });
    if (!response.ok) throw new Error(`Save failed: ${response.status}`);
  }

  async function lookUpNickname(nickname) {
    const fields = await fetchRecord("nicknames", nicknameId(nickname));
    return fields ? fields.userId.stringValue : null;
  }

  // Points a name at an ID. The rules only allow creating these, so a name can never be taken
  // from its owner. Returns the ID the name ends up with, which may be someone else's.
  async function claimNickname(nickname, userId) {
    const owner = await lookUpNickname(nickname);
    if (owner) return owner;
    const response = await writeRecord("nicknames", nicknameId(nickname), { userId: { stringValue: userId } });
    if (response.ok) return userId;
    const newOwner = await lookUpNickname(nickname);
    if (!newOwner) throw new Error(`Claim failed: ${response.status}`);
    return newOwner;
  }

  // Profiles made before hidden IDs live at users/u_NAME, and renamed ones left a pointer.
  // Returns { profile } if there's one still to convert, { userId } if it's been converted
  // already, or null if the name was never used.
  async function findOldProfile(nickname, hopsLeft = 5) {
    const fields = await fetchRecord("users", `u_${encodeURIComponent(cleanName(nickname))}`);
    if (!fields) return null;
    const record = JSON.parse(fields.data.stringValue);
    if (record.movedToId) return { userId: record.movedToId };
    if (record.movedTo && hopsLeft > 0) return findOldProfile(record.movedTo, hopsLeft - 1);
    if (!record.nickname || !record.sets || !Array.isArray(record.cardio)) throw new Error("Bad profile");
    return { profile: record };
  }

  // Moves an old profile to a hidden ID and leaves a marker, so every device ends up on the same one.
  async function convertOldProfile(profile, typedNickname) {
    const userId = newUserId();
    await uploadProfile({ ...profile, userId }, userId);
    const owner = await claimNickname(profile.nickname, userId);
    if (cleanName(typedNickname) !== cleanName(profile.nickname)) await claimNickname(typedNickname, owner);
    const marker = { data: { stringValue: JSON.stringify({ movedToId: owner }) } };
    await writeRecord("users", `u_${encodeURIComponent(cleanName(profile.nickname))}`, marker).catch(() => {});
    return owner;
  }

  // Finds who a nickname belongs to, or null if it's new. Throws if it can't tell.
  async function findUserId(nickname) {
    const userId = await lookUpNickname(nickname);
    if (userId) return userId;
    const old = await findOldProfile(nickname);
    if (!old) return null;
    if (old.profile) return convertOldProfile(old.profile, nickname);
    await claimNickname(nickname, old.userId); // an old name that hadn't been listed yet
    return old.userId;
  }

  // Combines two copies of a profile. Every set from both copies is kept, matched by id, unless
  // either copy deleted it. A set edited on both keeps the newer edit. For splits and exercises,
  // whichever copy was edited most recently wins.
  function mergeData(local, remote) {
    const remoteWins = !local.splits || (remote.splits && (remote.changedAt || 0) > (local.changedAt || 0));
    const [winner, loser] = remoteWins ? [remote, local] : [local, remote];
    const deleted = [...new Set([...(local.deleted || []), ...(remote.deleted || [])])].sort();

    const newestEdit = new Map();
    for (const set of [...Object.values(local.sets), ...Object.values(remote.sets)].flat()) {
      const known = newestEdit.get(set.id);
      if (!known || (set.editedAt || 0) > (known.editedAt || 0)) newestEdit.set(set.id, set);
    }

    const sets = {};
    const seen = new Set();
    for (const [name, list] of Object.entries(winner.sets)) {
      sets[name] = [...list];
      list.forEach((set) => seen.add(set.id));
    }
    for (const [name, list] of Object.entries(loser.sets)) {
      const missing = list.filter((set) => !seen.has(set.id));
      if (missing.length === 0) continue;
      sets[name] = [...(sets[name] || []), ...missing]
        .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
    }
    for (const name of Object.keys(sets)) {
      sets[name] = sets[name].filter((set) => !deleted.includes(set.id)).map((set) => newestEdit.get(set.id));
      if (sets[name].length === 0) delete sets[name];
    }

    const merged = { ...winner, sets };
    if (deleted.length > 0) merged.deleted = deleted;
    return merged;
  }

  let localWrites = 0;
  let syncing = false;
  let syncAgain = false;

  // Brings the phone and the online copy into line, then says if anything is still waiting.
  async function syncNow() {
    if (syncing) {
      syncAgain = true;
      return;
    }
    syncing = true;
    try {
      do {
        syncAgain = false;
        await syncOnce();
      } while (syncAgain);
    } catch {
      // No signal or a bad response. The phone's copy is safe, and the next sync retries.
    } finally {
      syncing = false;
      updateSyncStatus();
    }
  }

  async function syncOnce() {
    const writesBefore = localWrites;
    const before = loadData();
    if (!before.nickname || !before.splits) return; // nothing to back up until setup is finished

    const userId = before.userId || await ensureUserId(before.nickname);
    const remote = await fetchProfile(userId);
    const current = loadData(); // re-read: a set may have been logged during the wait
    if (!current.splits) return;
    current.userId = userId;

    const merged = remote ? { ...mergeData(current, remote), userId } : current;
    const mergedJson = JSON.stringify(merged);
    if (mergedJson !== JSON.stringify(current)) {
      saveData(merged);
      const popupOpen = logDialog.open || editor.open || splitEditor.open || nicknameEditor.open;
      if (!popupOpen) showScreen();
    }
    if (!remote || mergedJson !== JSON.stringify(remote)) await uploadProfile(merged);
    if (localWrites === writesBefore) localStorage.removeItem(UNSYNCED_KEY);
  }

  // First sync on a phone without a hidden ID yet: finds or creates it, and remembers it.
  async function ensureUserId(nickname) {
    let userId = await findUserId(nickname);
    if (!userId) {
      const newId = newUserId();
      userId = await claimNickname(nickname, newId);
    }
    const data = loadData();
    data.userId = userId;
    saveData(data);
    return userId;
  }

  function updateSyncStatus() {
    const waiting = Boolean(localStorage.getItem(UNSYNCED_KEY));
    syncStatus.hidden = !waiting;
    syncStatus.textContent = waiting ? "Saved on this phone. Will back up online when there's signal." : "";
  }

  // A coral ✕ for a settings row. `field` says what tapping it deletes.
  function deleteButton(label, field, value, disabled = false) {
    const button = document.createElement("button");
    button.className = "move delete";
    button.textContent = "✕";
    button.setAttribute("aria-label", label);
    button.dataset[field] = value;
    button.disabled = disabled;
    return button;
  }

  // A tappable row with up and down arrows. `scope` says which list the arrows reorder.
  function editLine(row, scope, index, count) {
    const line = document.createElement("div");
    line.className = "edit-line";
    const arrow = (text, label, delta, disabled) => {
      const button = document.createElement("button");
      button.className = "move";
      button.textContent = text;
      button.setAttribute("aria-label", label);
      button.dataset.move = delta;
      button.dataset.scope = scope;
      button.dataset.index = index;
      button.disabled = disabled;
      return button;
    };
    line.append(row, arrow("↑", "Move up", -1, index === 0), arrow("↓", "Move down", 1, index === count - 1));
    return line;
  }

  function renderSettings(data, split, index) {
    document.getElementById("settings-title").textContent = `${split.name} settings`;
    document.getElementById("settings-back").dataset.go = index;
    settingsList.replaceChildren(...split.exercises.map((name) => {

  function renderAppSettings(data) {

      button.classList.toggle("chosen", (button.dataset.order === "weight") === Boolean(data.weightFirst));

  // Newest first. Strength exercises mark the heaviest set, with reps as the tie-break.
  function renderHistory(data, name, index) {
    document.getElementById("history-title").textContent = name;
    document.getElementById("history-back").dataset.go = index;
    const sets = data.sets[name] || [];
    const strength = sets.filter((set) => "reps" in set);
    const best = strength.length > 1
      ? strength.reduce((top, set) => (set.weight > top.weight || (set.weight === top.weight && set.reps > top.reps) ? set : top))
      : null;

    if (sets.length === 0) {
      const message = document.createElement("p");
      message.className = "hint";
      message.textContent = "Nothing logged yet.";
      historyList.replaceChildren(message);
      return;
    }
    historyList.replaceChildren(...[...sets].reverse().map((set) => {
      const row = document.createElement("button");
      row.className = "edit-row";
      row.dataset.editSet = set.id;
      const label = document.createElement("span");
      label.textContent = describeSet(set);
      const date = document.createElement("small");
      date.className = "set-date";
      date.textContent = formatDate(set.date);
      label.append(date);
      row.append(label);
      if (set === best) {
        const tag = document.createElement("small");
        tag.textContent = "best";
        row.append(tag);
      }
      return row;
    }));
  }

  function describeSet(set) {
    const fields = "incline" in set ? CARDIO_FIELDS : STRENGTH_FIELDS;
    return fields.filter((field) => field.key in set).map((field) => fieldHint(field, set)).join(" · ");
  }

  // Built from the parts, because new Date("2026-11-02") would read it as UTC.
  function formatDate(date) {
    const [year, month, day] = date.split("-").map(Number);
    return new Date(year, month - 1, day).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  // The saved data and URL hash together decide which screen shows, so the
  // phone's own back gesture and a page refresh both work without any extra code.
  // Splits are addressed by position ("#0", "#0/settings") because their names can be anything.
  // Exercise history lives under its split, like "#0/history/LEG%20PRESS".
  function showScreen() {
    const route = location.hash.slice(1);
    const data = loadData();
    const splitRoute = route.match(/^(\d+)(?:\/(settings|history\/.+))?$/);
    const split = data.splits && splitRoute && data.splits[splitRoute[1]];

    // The back gesture shouldn't leave a popup floating over another screen.
    logDialog.close();
    editor.close();
    splitEditor.close();
    nicknameEditor.close();

    // Once there are logged sets the nickname is locked in, so they can't land on someone else's profile.
    const hasSets = Object.keys(data.sets).length > 0;

    if (!data.nickname || (route === "name" && !hasSets && !data.splits)) {
      nicknameInput.value = data.nickname || "";
      nicknameHint.textContent = NICKNAME_NOTE;
      updateNicknameDone();
      showOnly("nickname-screen");
    } else if (!data.splits) {
      setupBack.dataset.go = "name";
      setupBack.hidden = hasSets;
      showOnly("setup-screen");
    } else if (route === "setup") {
      setupBack.dataset.go = "settings"; // redoing setup: the current splits stay until Done
      setupBack.hidden = false;
      showOnly("setup-screen");
    } else if (split) {
      currentSplit = Number(splitRoute[1]);
      if (splitRoute[2] === "settings") {
        renderSettings(data, split, currentSplit);
        showOnly("settings");
      } else if (splitRoute[2]) {
        currentExercise = decodeURIComponent(splitRoute[2].slice("history/".length));
        renderHistory(data, currentExercise, currentSplit);
        showOnly("history");
      } else {
        renderExercises(split, currentSplit);
        showOnly("exercises");
      }
    } else if (route === "settings") {
      renderAppSettings(data);
      showOnly("app-settings");
    } else {
      renderLanding(data);
      showOnly("landing");
    }
  }

  function go(route) {
    if (location.hash.slice(1) === route) showScreen();
    else location.hash = route;
  }

  const NICKNAME_NOTE = "Your logs are saved online under this nickname, so you can get them back on any phone. There's no password, so anyone who types it can see them.";

  function updateNicknameDone() {
    nicknameDone.disabled = nicknameInput.value.trim() === "";
  }

  const MAX_SPLITS = 8;

  function presetNames(count) {
    return (SPLIT_PRESETS[count] || []).map(([name]) => cleanName(name));
  }

  const ALL_PRESET_NAMES = [1, 2, 3].flatMap(presetNames);

  // Re-renders the name boxes for a new count. Anything typed stays, and the
  // suggested names change to suit the count.
  function renderCustomNames(count) {
    const typed = [...customNames.children].map((input) => input.value);
    customNames.replaceChildren(...Array.from({ length: count }, (_, i) => {
      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = 20;
      input.autocomplete = "off";
      input.placeholder = `Split ${i + 1} name`;
      input.setAttribute("aria-label", `Split ${i + 1} name`);
      const kept = typed[i] && !ALL_PRESET_NAMES.includes(cleanName(typed[i]));
      input.value = kept ? typed[i] : presetNames(count)[i] || "";
      return input;
    }));
    updateCustomDone();
  }

  // Suggested names come with their starting exercises. Any other name starts empty.
  function startingExercises(name, count) {
    const preset = (SPLIT_PRESETS[count] || []).find(([presetName]) => cleanName(presetName) === name);
    return preset ? [...preset[1], ...FINISHERS].map(cleanName) : [];
  }

  // Keeps digits only, then shows a name box per split. Boxes just hide while the number
  // is blank or too big, so clearing it to retype doesn't lose any names.
  function updateSplitCount() {
    splitCount.value = splitCount.value.replace(/\D/g, "");
    const count = Number(splitCount.value);
    const valid = count >= 1 && count <= MAX_SPLITS;

    customNames.hidden = !valid;
    if (valid) renderCustomNames(count);
    if (!splitCount.value) setupHint.textContent = "";
    else if (!valid) setupHint.textContent = `Enter a number from 1 to ${MAX_SPLITS}.`;
    else if (count <= 3) setupHint.textContent = "Tap a name to change it. Suggested names come with exercises. New names start empty.";
    else setupHint.textContent = "Name each split. They start empty.";
    updateCustomDone();
  }

  function resetSetup() {
    splitCount.value = "";
    customNames.replaceChildren();
    updateSplitCount();
  }

  // Every box filled, and no two names the same once they're in caps.
  function customSplitNames() {
    if (customNames.hidden) return null;
    const names = [...customNames.children].map((input) => cleanName(input.value));
    const valid = names.length > 0 && names.every(Boolean) && new Set(names).size === names.length;
    return valid ? names : null;
  }

  function openEditor(name) {

  function setEditorType(type) {

  function updateEditor() {
    const data = loadData();
    const name = cleanName(editorName.value);
    const adding = editingName === null;
    const alreadyHere = adding && data.splits[currentSplit].exercises.includes(name);

    let hint = "";
    if (alreadyHere) {
      hint = "Already in this split.";
    } else if (!adding) {
      hint = "Renames it in every split.";
    } else if (exerciseExists(data, name)) {
      hint = "Already exists, so it keeps its logged sets.";

    editorSave.disabled = !name || alreadyHere;

  function saveEditor() {
    const name = cleanName(editorName.value);
    const renaming = editingName !== null && name !== editingName;
    if (renaming && exerciseExists(loadData(), name)
        && !confirm(`${name} already exists. Merge them? Their logged sets get combined.`)) return;

    const saved = updateData((data) => {
      if (renaming) renameExercise(data, editingName, name);
      if (editingName === null) data.splits[currentSplit].exercises.push(name);
      setExerciseType(data, name, editorType);
    });

  function openNicknameEditor() {

  // The data stays put under its hidden ID, so this only checks the name is free, then reserves it.
  // Old names keep working and stay reserved, because they still lead to this ID.
  async function saveNickname() {
    const nickname = newNickname.value.trim();
    const { nickname: oldNickname, userId } = loadData();
    if (!nickname) return;

    if (cleanName(nickname) === cleanName(oldNickname)) {
      if (updateData((data) => { data.nickname = nickname; })) showScreen();
      return;
    }
    if (!userId) {
      newNicknameHint.textContent = "Couldn't connect. Check your signal and try again.";
      syncNow();
      return;
    }

    newNicknameSave.disabled = true;
    newNicknameSave.textContent = "Checking...";
    try {
      // A name someone used before hidden IDs is theirs, even if it isn't listed yet.
      const old = await findOldProfile(nickname);
      const usedBySomeoneElse = old && old.userId !== userId;
      const owner = usedBySomeoneElse ? null : await claimNickname(nickname, userId);
      if (owner !== userId) {
        newNicknameHint.textContent = "That nickname is taken. Try another.";
        return;
      }
    } catch {
      newNicknameHint.textContent = "Couldn't connect. Check your signal and try again.";
      return;
    } finally {
      newNicknameSave.textContent = "SAVE";
      newNicknameSave.disabled = false;
    }

    if (updateData((data) => { data.nickname = nickname; })) {
      showToast("renamed");
      showScreen();
    }
  }

  // Only this split's list changes. Sets stay, so adding it back brings them back.
  function deleteExercise(name) {
    const split = loadData().splits[currentSplit];
    if (!confirm(`Delete ${name} from ${split.name}? Its logged sets are kept.`)) return;
    const saved = updateData((data) => {
      const list = data.splits[currentSplit];
      list.exercises = list.exercises.filter((exercise) => exercise !== name);
    });
    if (saved) showScreen();
  }

  function deleteSplit(index) {
    const { name } = loadData().splits[index];
    if (!confirm(`Delete ${name}? Its exercise list goes, but logged sets are kept.`)) return;
    if (updateData((data) => { data.splits.splice(index, 1); })) showScreen();
  }

  function moveItem(scope, index, delta) {
    const saved = updateData((data) => {
      const list = scope === "splits" ? data.splits : data.splits[currentSplit].exercises;
      const [item] = list.splice(index, 1);
      list.splice(index + delta, 0, item);
    });
    if (saved) showScreen();
  }

  // Opens empty to log a new set, or filled in when given a past set to edit.
  function openLog(exercise, setToEdit = null) {
    const data = loadData();
    const pastSets = data.sets[exercise] || [];
    const lastSet = pastSets[pastSets.length - 1] || {};
    const isCardio = setToEdit ? "incline" in setToEdit : data.cardio.includes(exercise);
    const strengthFields = data.weightFirst ? [...STRENGTH_FIELDS].reverse() : STRENGTH_FIELDS;
    currentExercise = exercise;
    currentFields = isCardio ? CARDIO_FIELDS : strengthFields;
    editingSetId = setToEdit && setToEdit.id;
    logForm.reset();
    logForm.classList.toggle("three-fields", currentFields.length === 3);
    logInputs.forEach((input, i) => {
      const field = currentFields[i];
      input.hidden = !field;
      if (!field) return;
      input.placeholder = fieldHint(field, setToEdit ? {} : lastSet);
      input.setAttribute("aria-label", field.label);
      input.inputMode = field.whole ? "numeric" : "decimal";
      if (setToEdit && field.key in setToEdit) input.value = setToEdit[field.key];
    });
    logHistory.hidden = Boolean(setToEdit) || pastSets.length === 0;
    logDelete.hidden = !setToEdit;
    updateTick();
    logDialog.showModal();
  }

  // The last logged value, or the field's name if there isn't one.
  function fieldHint(field, lastSet) {
    if (!(field.key in lastSet)) return field.placeholder;
    if (lastSet[field.key] === 0 && field.zeroHint) return field.zeroHint;
    return `${lastSet[field.key]}${field.unit}`;
  }

  // Local date, not UTC: toISOString() would put a morning east of UTC on yesterday.
  function todayLocal() {
    const now = new Date();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${now.getFullYear()}-${month}-${day}`;
  }

  function isValidSet() {
    return currentFields.every((field, i) => {
      const value = logInputs[i].value;
      if (value === "") return Boolean(field.blankIsZero);
      return Number.isFinite(Number(value)) && Number(value) >= field.min;
    });
  }

  function updateTick() {
    tick.disabled = !isValidSet();
  }

  function logSet() {
    if (editingSetId) {
      saveEditedSet();
      return;
    }
    const set = {
      // Not crypto.randomUUID(): browsers only allow it on https, which would break phone testing.
      id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
      date: todayLocal(),
    };
    currentFields.forEach((field, i) => { set[field.key] = Number(logInputs[i].value); });

    const saved = updateData((data) => {
      data.sets[currentExercise] = data.sets[currentExercise] || [];
      data.sets[currentExercise].push(set);
    }, false);
    if (saved) showToast("logged");
    logDialog.close();
  }

  function saveEditedSet() {
    const saved = updateData((data) => {
      const set = data.sets[currentExercise].find((past) => past.id === editingSetId);
      currentFields.forEach((field, i) => { set[field.key] = Number(logInputs[i].value); });
      set.editedAt = Date.now();
    }, false);
    if (saved) showToast("updated");
    showScreen();
  }

  // The id is remembered so a sync can't bring the set back from another copy.
  function deleteEditingSet() {
    if (!confirm("Delete this set? This can't be undone.")) return;
    const saved = updateData((data) => {
      data.sets[currentExercise] = data.sets[currentExercise].filter((set) => set.id !== editingSetId);
      if (data.sets[currentExercise].length === 0) delete data.sets[currentExercise];
      data.deleted = [...(data.deleted || []), editingSetId].sort();
    }, false);
    if (saved) showToast("deleted");
    showScreen();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 1200);
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.go !== undefined) go(button.dataset.go);
    if (button.dataset.split) go(button.dataset.split);
    if (button.dataset.exercise) openLog(button.dataset.exercise);
    if (button.dataset.edit) openEditor(button.dataset.edit);
    if (button.dataset.add !== undefined) openEditor(null);
    if (button.dataset.type) setEditorType(button.dataset.type);
    if (button.dataset.move) moveItem(button.dataset.scope, Number(button.dataset.index), Number(button.dataset.move));
    if (button.dataset.editSplit) openSplitEditor(Number(button.dataset.editSplit));
    if (button.dataset.deleteExercise) deleteExercise(button.dataset.deleteExercise);
    if (button.dataset.deleteSplit) deleteSplit(Number(button.dataset.deleteSplit));
    if (button.dataset.addSplit !== undefined) openSplitEditor(null);
    if (button.dataset.editSet) {
      openLog(currentExercise, loadData().sets[currentExercise].find((set) => set.id === button.dataset.editSet));
    }
    if (button.dataset.order) {
      const order = button.dataset.order;
      if (updateData((data) => { data.weightFirst = order === "weight"; })) showScreen();
    }
  });

  nicknameInput.addEventListener("input", updateNicknameDone);

  // Checks online first, so a returning person gets their data back instead of a blank setup.
  // Without signal it has to stop: starting fresh could replace a saved profile's setup.
  document.getElementById("nickname-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const nickname = nicknameInput.value.trim();
    if (!nickname || nicknameDone.disabled) return;

    nicknameDone.disabled = true;
    nicknameDone.textContent = "Checking...";
    let userId;
    let remote;
    try {
      userId = await findUserId(nickname);
      remote = userId && await fetchProfile(userId);
    } catch {
      nicknameHint.textContent = "Couldn't connect. Check your signal and try again.";
      return;
    } finally {
      nicknameDone.textContent = "Continue";
      updateNicknameDone();
    }

    const saved = updateData((data) => {
      Object.assign(data, remote ? mergeData(data, remote) : { nickname });
      if (userId) data.userId = userId;
    }, false);
    if (saved) go("");
  });

  splitCount.addEventListener("input", updateSplitCount);
  customNames.addEventListener("input", updateCustomDone);

  document.getElementById("custom-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const names = customSplitNames();
    if (!names) return;
    if (loadData().splits && !confirm("Replace your splits? Exercise lists reset, but logged sets are kept.")) return;
    const splits = names.map((name) => ({ name, exercises: startingExercises(name, names.length) }));
    if (updateData((data) => { data.splits = splits; })) go("");
  });

  editorName.addEventListener("input", updateEditor);

  editor.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!editorSave.disabled) saveEditor();
  });

  splitNameInput.addEventListener("input", updateSplitEditor);

  // Sets are stored by exercise, so changing splits doesn't touch them.
  splitEditor.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (splitSave.disabled) return;
    const name = cleanName(splitNameInput.value);
    const saved = updateData((data) => {
      if (editingSplit === null) data.splits.push({ name, exercises: [] });
      else data.splits[editingSplit].name = name;
    });
    if (saved) showScreen();
  });

  nicknameRow.addEventListener("click", openNicknameEditor);

  newNickname.addEventListener("input", () => {
    newNicknameSave.disabled = newNickname.value.trim() === "";
  });

  nicknameEditor.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!newNicknameSave.disabled) saveNickname();
  });

  document.getElementById("redo-setup").addEventListener("click", () => {
    resetSetup();
    go("setup");
  });

  reorderToggle.addEventListener("click", () => {
    reordering = !reordering;
    showScreen();
  });

  logHistory.addEventListener("click", () => {
    go(`${currentSplit}/history/${encodeURIComponent(currentExercise)}`);
  });

  logDelete.addEventListener("click", deleteEditingSet);

  // Filter as you type, because inputmode only picks the keypad: a laptop keyboard
  // or a paste could still put letters in.
  logInputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      if (currentFields[i].whole) {
        input.value = input.value.replace(/\D/g, "");
      } else {
        const [whole, ...decimals] = input.value
          .replace(/,/g, ".") // some phone keypads offer a comma as the decimal key
          .replace(/[^\d.]/g, "")
          .split(".");
        input.value = decimals.length ? `${whole}.${decimals.join("")}` : whole;
      }
      updateTick();
    });
  });

  logForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (isValidSet()) logSet();
  });

  // Tapping outside a popup closes it without saving.
  for (const dialog of [logDialog, editor, splitEditor, nicknameEditor]) {
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  }

  window.addEventListener("hashchange", () => {
    reordering = false;
    showScreen();
  });
  window.addEventListener("online", syncNow);
  // Not available when opened as a file or over plain http, which is fine for local testing.
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") syncNow();
  });
  try {
    showScreen();
    syncNow();
  } catch {
    // Unreadable saved data: say so, and don't offer setup, which would overwrite it.
    document.body.textContent = "Couldn't read your saved data.";
  }
</script>
</body>
</html>
